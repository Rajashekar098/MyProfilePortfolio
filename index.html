<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajashekar Chinthala | Data Analyst & BI Specialist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #080312;
            --text-main: #f8fafc;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .mono {
            font-family: 'Fira Code', monospace;
        }
        
        /* Cosmic Ambient Background Glow */
        .cosmic-bg {
            background: 
                radial-gradient(circle at 50% 18%, rgba(139, 92, 246, 0.32) 0%, rgba(236, 72, 153, 0.14) 35%, rgba(8, 3, 18, 0.98) 72%),
                linear-gradient(180deg, #0d051d 0%, #080312 100%);
        }

        body.light-glow {
            background: 
                radial-gradient(circle at 50% 18%, rgba(168, 85, 247, 0.45) 0%, rgba(236, 72, 153, 0.25) 40%, #130726 80%);
        }

        /* Floating Skill Pills Animation */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(8px); }
        }
        .float-1 { animation: floatSlow 3.5s ease-in-out infinite; }
        .float-2 { animation: floatReverse 4.1s ease-in-out infinite 0.3s; }
        .float-3 { animation: floatSlow 3.8s ease-in-out infinite 0.7s; }
        .float-4 { animation: floatReverse 4.4s ease-in-out infinite 1.1s; }

        /* Rotating Orbit Rings */
        @keyframes spinOrbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .orbit-ring-1 {
            animation: spinOrbit 38s linear infinite;
        }
        .orbit-ring-2 {
            animation: spinOrbit 55s linear infinite reverse;
        }

        /* Typewriter Cursor */
        .cursor-blink {
            display: inline-block;
            width: 2.5px;
            height: 1.15em;
            background-color: #ec4899;
            vertical-align: middle;
            margin-left: 3px;
            animation: blink 0.85s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Skill Pill Styling */
        .skill-pill {
            background: rgba(13, 8, 28, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.38);
            box-shadow: 0 8px 25px -4px rgba(0, 0, 0, 0.75), 0 0 15px rgba(139, 92, 246, 0.2);
            transition: all 0.25s ease;
        }
        .skill-pill:hover {
            border-color: #ec4899;
            transform: scale(1.08) !important;
            box-shadow: 0 0 22px rgba(236, 72, 153, 0.5);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
        }
        .btn-gradient:hover {
            opacity: 0.94;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.45);
        }
    </style>
</head>
